# Simple Nginx Configuration for Mirai Website
# Copy this to your Nginx sites-available directory

server {
    listen 80;
    server_name your-domain.com;
    
    # Root directory of your MiraiWebsite project
    root /path/to/your/MiraiWebsite/public;
    
    # Serve CSS files directly
    location /css/ {
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "text/css";
    }
    
    # Serve JavaScript files directly
    location /js/ {
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Content-Type "application/javascript";
    }
    
    # Serve images directly
    location /assets/ {
        try_files $uri $uri/ =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    
    # Serve all other requests through Node.js
    location / {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
