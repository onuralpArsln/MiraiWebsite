# Enhanced Nginx Configuration for CSS Animations
# This configuration ensures optimal CSS animation performance on the deployed server

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    # Document root for static files
    root /path/to/your/MiraiWebsite/public;
    index index.html;
    
    # Enhanced Gzip compression for better performance
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_types 
        text/css 
        text/javascript 
        application/javascript 
        application/json
        text/plain 
        text/xml 
        application/xml 
        application/xml+rss 
        text/json
        application/font-woff
        application/font-woff2;
    
    # Security headers (relaxed for animations)
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Enhanced CSS file serving with animation optimization
    location ~* \.css$ {
        # Ensure proper MIME type
        add_header Content-Type "text/css; charset=utf-8" always;
        
        # Optimize caching for CSS files
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        
        # Enable CORS for CSS files
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        
        # Special headers for animation CSS files
        if ($uri ~* "animations\.css$") {
            add_header X-Animation-Optimized "true" always;
            # Disable compression for animations.css to ensure smooth playback
            gzip off;
        }
        
        # Try to serve file directly, fallback to Node.js if not found
        try_files $uri @nodejs;
        
        # Log CSS requests for debugging
        access_log /var/log/nginx/css_files.log;
    }
    
    # Enhanced JavaScript file serving
    location ~* \.js$ {
        add_header Content-Type "application/javascript; charset=utf-8" always;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Access-Control-Allow-Origin "*" always;
        
        try_files $uri @nodejs;
        
        access_log /var/log/nginx/js_files.log;
    }
    
    # Serve other static files with optimization
    location ~* \.(png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header Vary "Accept-Encoding" always;
        
        # Enable CORS for fonts
        if ($uri ~* "\.(woff|woff2|ttf|eot)$") {
            add_header Access-Control-Allow-Origin "*" always;
        }
        
        try_files $uri @nodejs;
    }
    
    # Animation test page (bypass static serving for testing)
    location /animation-test.html {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # Disable caching for test page
        add_header Cache-Control "no-cache, no-store, must-revalidate" always;
        add_header Pragma "no-cache" always;
        add_header Expires "0" always;
    }
    
    # Health check endpoint
    location /health {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Test CSS endpoint for debugging
    location /test-css {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Proxy all other requests to Node.js application
    location / {
        try_files $uri @nodejs;
    }
    
    # Node.js application backend
    location @nodejs {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Enhanced timeout settings for better performance
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        
        # Buffer settings for better performance
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 4k;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Enhanced logging for animation debugging
    access_log /var/log/nginx/mirai_access.log;
    error_log /var/log/nginx/mirai_error.log;
    
    # Log format for animation debugging
    log_format animation_debug '$remote_addr - $remote_user [$time_local] '
                              '"$request" $status $body_bytes_sent '
                              '"$http_referer" "$http_user_agent" '
                              '$request_time $upstream_response_time';
    
    # Use debug logging for CSS requests
    location ~* \.css$ {
        access_log /var/log/nginx/css_debug.log animation_debug;
    }
}
