# Nginx Configuration for Mirai Website
# This configuration serves static files directly through Nginx
# and proxies API requests to the Node.js application

server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    
    # Document root for static files
    root /path/to/your/MiraiWebsite/public;
    index index.html;
    
    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript text/plain text/xml application/xml application/xml+rss text/json;
    
    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    
    # Serve static files directly with proper caching
    location ~* \.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Vary "Accept-Encoding";
        
        # Try to serve file directly, fallback to Node.js if not found
        try_files $uri @nodejs;
        
        # Log static file requests
        access_log /var/log/nginx/static_files.log;
    }
    
    # Serve CSS files with proper MIME type
    location ~* \.css$ {
        add_header Content-Type text/css;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        # Try to serve file directly, fallback to Node.js if not found
        try_files $uri @nodejs;
        
        access_log /var/log/nginx/css_files.log;
    }
    
    # Serve JavaScript files
    location ~* \.js$ {
        add_header Content-Type application/javascript;
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        try_files $uri @nodejs;
        
        access_log /var/log/nginx/js_files.log;
    }
    
    # Serve images
    location ~* \.(png|jpg|jpeg|gif|ico|svg)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        
        try_files $uri @nodejs;
    }
    
    # Serve fonts
    location ~* \.(woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header Access-Control-Allow-Origin "*";
        
        try_files $uri @nodejs;
    }
    
    # Proxy all other requests to Node.js application
    location / {
        try_files $uri @nodejs;
    }
    
    # Node.js application backend
    location @nodejs {
        proxy_pass http://localhost:3002;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
        
        # Timeout settings
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
    }
    
    # Health check endpoint (bypass static file serving)
    location /health {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Test CSS endpoint (bypass static file serving)
    location /test-css {
        proxy_pass http://localhost:3002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    
    # Error pages
    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
    
    # Logging
    access_log /var/log/nginx/mirai_access.log;
    error_log /var/log/nginx/mirai_error.log;
}
